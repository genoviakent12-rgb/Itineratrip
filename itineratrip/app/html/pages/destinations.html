
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ItineraTrip - Destinations</title>

    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/destinations_styles.css" />
  </head>

  <body>
    <main class="destinations">
      <section class="section">
        <p class="heading">Find your next adventure!</p>
        <h1 class="title">Top Destinations</h1>
        <p class="description">
          Explore new places and find somewhere special for your next trip.
        </p>
        <!-- pictures are horizontally arranged and will move from left to right -->
        <div
          class="list"
          aria-label="Destination pictures"
          tabindex="0"
        >
          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination1.png"
              alt="Greece"
            />
            <p class="place-name">Greece, Acropolis of Athens</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination2.png"
              alt="United Arab Emirates"
            />
            <p class="place-name">Ras Al Khaimah</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination3.png"
              alt="Philippines"
            />
            <p class="place-name">Bacolod City, Lagoon</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination4.png"
              alt="Canada"
            />
            <p class="place-name">Banff, National Park</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination5.png"
              alt="Indonesia"
            />
            <p class="place-name">Sacred Monkey Forest</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination6.png"
              alt="India"
            />
            <p class="place-name">Munshi Ghat</p>
          </div>

          <div class="images">
            <img
              src="../../src/assets/images/destinations/destination7.png"
              alt="United States"
            />
            <p class="place-name">New York City</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
